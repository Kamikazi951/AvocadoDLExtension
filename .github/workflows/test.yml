name: Test and package

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci
      - run: npm test
      - run: npx playwright install chromium
      - run: npm run test:browser
      - run: npm run test:twitter
      - run: npm run test:request-context
      - run: python build.py
      - uses: actions/upload-artifact@v4
        with:
          name: avocadodl-chrome-extension
          path: ../avocadodl-chrome-extension-v*.zip
          if-no-files-found: error
